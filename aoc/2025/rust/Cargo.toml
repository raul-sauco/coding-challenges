[package]
name = "advent_of_code"
version = "0.12.0"
authors = ["Felix Spöttel <1682504+fspoettel@users.noreply.github.com>"]
edition = "2024"
default-run = "advent_of_code"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
doctest = false

[profile.dhat]
inherits = "release"
debug = 1

[features]
dhat-heap = ["dhat"]
today = ["chrono"]
test_lib = []

[dependencies]

# Template dependencies
chrono = { version = "0.4.38", optional = true }
dhat = { version = "0.3.3", optional = true }
pico-args = "0.5.0"
tinyjson = "2.5.1"

# Solution dependencies
nom = "8.0.0"
rayon = "1.11.0"
glam = "0.30.9"
rstest = "0.26.1"
itertools = "0.14.0"
bitvec = "1.0.1"
z3 = "0.19.7"

[dev-dependencies]
pretty_assertions = "1.4.1"
rstest = "0.26.1"
test-case = "3.3.1"
